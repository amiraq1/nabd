name: ci

on:
  push:
    branches:
      - main
      - "audit/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.arch }})
    # arm64 is a first-class target, not only a cross-build: the isolation and
    # seccomp proofs must run on AArch64 hardware too. Both legs are pinned to
    # 26.04 (the image ubuntu-latest resolves to) and to the free native arm64
    # runner: the 24.04 image denies bwrap its loopback RTM_NEWADDR, which
    # fails the sandbox proof on either architecture.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The sandbox proof test is skipped when bubblewrap is absent. Install it
      # so CI actually proves the isolation instead of only compiling it.
      # build-essential supplies the gcc the race detector needs.
      - name: install bubblewrap and gcc for sandbox proof
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap build-essential
          bwrap --version

      - name: verify native ${{ matrix.arch }}
        run: |
          uname -m
          test "$(go env GOARCH)" = "${{ matrix.arch }}"

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: go mod verify
        run: go mod verify

      - name: go test
        run: go test ./... -count=1

      - name: go race test (short)
        run: go test -race -short ./... -count=1 -p 2

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: cross build (linux amd64/arm64)
        env:
          CGO_ENABLED: "0"
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "/tmp/nabdcoder-$arch" ./cmd/agent
            GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "/tmp/mcp-server-$arch" ./cmd/mcp-server
            GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "/tmp/nabd-mcp-guard-$arch" ./cmd/mcp-guard
            GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "/tmp/nabd-limit-$arch" ./cmd/nabd-limit
            GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "/tmp/nabd-sandbox-probe-$arch" ./cmd/nabd-sandbox-probe
          done

      - name: cross build (android arm64)
        env:
          CGO_ENABLED: "0"
          GOOS: android
          GOARCH: arm64
        run: go build ./...

      - name: cross build (windows amd64)
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          go build ./...
          go build -trimpath -ldflags="-s -w" -o /tmp/nabdcoder-windows-amd64.exe ./cmd/agent
