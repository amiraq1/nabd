name: ci

on:
  push:
    branches:
      - main
      - "audit/**"
  pull_request:

# Artifacts are build outputs, not signatures, not a GitHub Release and not an
# independent provenance attestation. Nothing here is uploaded to a registry.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.arch }})
    # arm64 is a first-class target, not only a cross-build: the isolation and
    # seccomp proofs must run on AArch64 hardware too. Both legs are pinned to
    # 26.04 (the image ubuntu-latest resolves to) and to the free native arm64
    # runner: the 24.04 image denies bwrap its loopback RTM_NEWADDR, which
    # fails the sandbox proof on either architecture.
    # Note on QEMU: qemu-user-static does not emulate kernel seccomp-BPF filters
    # or bubblewrap user namespaces faithfully; native hardware runners are required
    # for real runtime verification.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Dedicated build output directory, outside the checkout, so no binary can
      # be committed by accident and the artifact contains only intended files.
      # Resolved in a step because the `runner` context is not available in
      # job-level env, and exported through GITHUB_ENV so later steps and the
      # artifact upload receive a normalized absolute path (upload-artifact
      # rejects any path containing "..").
      - name: resolve DIST
        run: echo "DIST=${RUNNER_TEMP}/nabd-dist" >> "$GITHUB_ENV"

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      # The sandbox proof test is skipped when bubblewrap is absent. Install it
      # so CI actually proves the isolation instead of only compiling it.
      # build-essential supplies the gcc the race detector needs.
      - name: install bubblewrap and gcc for sandbox proof
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap build-essential
          bwrap --version

      # The isolation proof must run, not be skipped: make the requirements
      # explicit so a missing capability fails here instead of turning the
      # proof step into a silent green.
      - name: require bubblewrap and unprivileged user namespaces
        run: |
          set -euo pipefail
          bwrap --unshare-net --dev-bind / / true
          # bare `unshare -Ur` is denied by the hosted runner's AppArmor policy
          # (/proc/self/uid_map: Operation not permitted) even when bwrap's own
          # profile is allowed, so the capability is proved through bwrap, which
          # is the only unprivileged-userns entry point the tests use. bwrap maps
          # the caller's uid (1001), not root, hence comparing namespace ids
          # rather than asserting uid 0.
          host_ns="$(readlink /proc/self/ns/user)"
          guest_ns="$(bwrap --unshare-user --unshare-pid --unshare-net --dev-bind / / readlink /proc/self/ns/user)"
          echo "user namespace: host=$host_ns guest=$guest_ns"
          test -n "$guest_ns"
          test "$host_ns" != "$guest_ns"

      - name: verify native ${{ matrix.arch }}
        run: |
          uname -m
          test "$(go env GOARCH)" = "${{ matrix.arch }}"

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: go mod verify
        run: go mod verify

      - name: go test
        run: go test ./... -count=1

      - name: go race test (short)
        run: go test -race -short ./... -count=1 -p 2

      # A skipped sandbox or go_verify-integration test is not a pass.
      - name: prove isolation (fails on skip)
        run: |
          set -euo pipefail
          out="$(go test ./internal/sandbox/... ./internal/tools/... -count=1 -v \
            -run 'TestLinuxSandbox|TestGoVerifySandbox|TestSandboxMCP' 2>&1)" || { echo "$out"; exit 1; }
          echo "$out"
          if grep -qE '^[[:space:]]*--- SKIP' <<<"$out"; then
            echo "::error::isolation tests were skipped; bwrap or user namespaces are missing"
            exit 1
          fi
          if ! grep -qE '^[[:space:]]*--- PASS: TestGoVerifySandboxHidesWorkspaceSecrets' <<<"$out"; then
            echo "::error::the go_verify sandbox integration test did not run"
            exit 1
          fi

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: cross build (linux amd64/arm64)
        env:
          CGO_ENABLED: "0"
          GOARM64: "v8.0"
        run: |
          set -euo pipefail
          mkdir -p "$DIST"
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "$DIST/nabdcoder-linux-$arch" ./cmd/agent
            GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "$DIST/mcp-server-linux-$arch" ./cmd/mcp-server
            GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "$DIST/nabd-mcp-guard-linux-$arch" ./cmd/mcp-guard
            GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "$DIST/nabd-limit-linux-$arch" ./cmd/nabd-limit
            GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "$DIST/nabd-sandbox-probe-linux-$arch" ./cmd/nabd-sandbox-probe
          done

      - name: verify linux/arm64 ELF binaries
        run: |
          for bin in "$DIST"/*-linux-arm64; do
            echo "Checking $bin"
            file "$bin" | grep -E "ELF 64-bit (LSB executable|LSB pie executable), ARM aarch64"
            go version -m "$bin" | grep "GOARCH=arm64"
          done

      - name: cross build (android arm64)
        env:
          CGO_ENABLED: "0"
          GOOS: android
          GOARCH: arm64
          GOARM64: "v8.0"
        run: |
          set -euo pipefail
          go build ./...
          GOOS=android GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o "$DIST/nabdcoder-android-arm64" ./cmd/agent
          file "$DIST/nabdcoder-android-arm64" | grep -E "ELF 64-bit (LSB executable|LSB pie executable), ARM aarch64"

      - name: cross build (windows amd64)
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          set -euo pipefail
          go build ./...
          go build -trimpath -ldflags="-s -w" -o "$DIST/nabdcoder-windows-amd64.exe" ./cmd/agent

      # A partial build must never look complete: every expected output is
      # checked before the manifest is written, the manifest uses a fixed order
      # and is verified against the final files.
      - name: build manifest and verify checksums (SHA256SUMS)
        run: |
          set -euo pipefail
          REQUIRED=(
            nabdcoder-linux-amd64
            nabdcoder-linux-arm64
            nabdcoder-android-arm64
            nabdcoder-windows-amd64.exe
            mcp-server-linux-amd64
            mcp-server-linux-arm64
            nabd-mcp-guard-linux-amd64
            nabd-mcp-guard-linux-arm64
            nabd-limit-linux-amd64
            nabd-limit-linux-arm64
            nabd-sandbox-probe-linux-amd64
            nabd-sandbox-probe-linux-arm64
          )
          for name in "${REQUIRED[@]}"; do
            if [ ! -s "$DIST/$name" ]; then
              echo "::error::missing or empty build output: $name"
              exit 1
            fi
          done
          ( cd "$DIST" && sha256sum "${REQUIRED[@]}" > SHA256SUMS )
          cat "$DIST/SHA256SUMS"
          ( cd "$DIST" && sha256sum -c SHA256SUMS )

      - name: upload cross-build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nabdcoder-cross-${{ matrix.arch }}
          path: ${{ env.DIST }}
          if-no-files-found: error
          retention-days: 7
